<!doctype html>
<html>
<head><meta charset="utf-8"><title>glottis script-tag bundle</title></head>
<body>
<!-- The built bundle, loaded the way a page without a bundler would. -->
<script src="/dist/glottis.min.js"></script>
<script>
    window.glottis.serve({
        clients: { remoteWindow: { allowed: true, domain: '*' } },
        exports: { add: ({ a, b }) => a + b, version: 'bundle' }
    });
</script>
</body>
</html>
