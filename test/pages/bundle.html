<!doctype html>
<html>
<head><meta charset="utf-8"><title>spor script-tag bundle</title></head>
<body>
<!-- The built bundle, loaded the way a page without a bundler would. -->
<script src="/dist/spor.min.js"></script>
<script>
    window.spor.serve({
        domain:  '*',
        exports: { add: ({ a, b }) => a + b, version: 'bundle' }
    });
</script>
</body>
</html>
